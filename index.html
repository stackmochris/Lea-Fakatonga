<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8f1d22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kolosālio" />
    <meta
      name="description"
      content="Kolosālio is an English–Tongan glossary of specialist terms."
    />
    <title>Kolosālio</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <script>
      try {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        var themePref = localStorage.getItem("lea-theme");
        var resolved = themePref === "dark" || themePref === "light"
          ? themePref
          : themePref === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : "light";
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", resolved === "dark" ? "#0b0b0c" : "#8f1d22");
        if (localStorage.getItem("lea-text-size") === "large") {
          document.documentElement.setAttribute("data-text-size", "large");
        }
        if (localStorage.getItem("lea-direction") === "to-en") {
          document.documentElement.lang = "to";
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
