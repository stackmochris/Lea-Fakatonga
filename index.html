<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C10020" />
    <meta
      name="description"
      content="Lea Fakatonga is an English–Tongan specialist glossary."
    />
    <title>Lea Fakatonga · Specialist terminology dictionary</title>
    <link rel="icon" href="%BASE_URL%manulua.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      try {
        var themePref = localStorage.getItem("lea-theme");
        var resolved = themePref === "dark" || themePref === "light"
          ? themePref
          : themePref === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : "light";
        document.documentElement.setAttribute("data-theme", resolved);
        document.documentElement.style.colorScheme = resolved;
        if (resolved === "dark") {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#100E0C");
        }
        if (localStorage.getItem("lea-text-size") === "large") {
          document.documentElement.setAttribute("data-text-size", "large");
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
